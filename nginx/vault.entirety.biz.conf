# vault.entirety.biz — se instala en /etc/nginx/sites-available/vault.entirety.biz
# Misma ruta que antes (todo → 127.0.0.1:3444). Añadido: límites, timeouts y cabeceras.
# La app ya pone CSP, X-Frame-Options, CSRF, sesión HttpOnly y su propio límite de intentos.

limit_req_zone  $binary_remote_addr zone=vault_login:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=vault_all:10m   rate=20r/s;
limit_conn_zone $binary_remote_addr zone=vault_conn:10m;

server {
    server_name vault.entirety.biz;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn vault_conn 30;
    client_max_body_size 2m;            # la app acepta JSON de hasta 1 MB
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 15s;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /auth/login {
        limit_req zone=vault_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3444;
        include /etc/nginx/snippets/vault-proxy.conf;
    }
    location / {
        limit_req zone=vault_all burst=50 nodelay;
        proxy_pass http://127.0.0.1:3444;
        include /etc/nginx/snippets/vault-proxy.conf;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vault.entirety.biz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vault.entirety.biz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = vault.entirety.biz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    listen [::]:80;
    server_name vault.entirety.biz;
    return 404; # managed by Certbot
}
