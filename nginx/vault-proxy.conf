# Se instala en /etc/nginx/snippets/vault-proxy.conf
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;   # se reemplaza: la app confía en 1 proxy (TRUST_PROXY)
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 120s;                         # restaurar versiones puede tardar
