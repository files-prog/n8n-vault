# Reverse-proxy snippet that adds the "Version History" button to the n8n
# editor WITHOUT forking n8n. It injects one <script> tag into the editor's
# HTML responses. Upgrading n8n never breaks this — if the injection ever
# stopped matching, the only symptom would be a missing button, never a
# broken n8n.
#
# Adjust server_name, TLS and upstream addresses to your environment, then
# include this in your nginx configuration.

server {
    listen 443 ssl;
    server_name n8n.your-company.com;

    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;

        # Required for the n8n editor (websockets / push)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;

        # --- n8n Vault button injection -----------------------------------
        # sub_filter only touches text/html responses; API traffic and
        # static assets pass through untouched.
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>'
            '<script src="https://vault.your-company.com/inject.js" defer></script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
        # -------------------------------------------------------------------
    }
}

server {
    listen 443 ssl;
    server_name vault.your-company.com;

    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        proxy_pass http://vault:3444;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
