<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>n8n Vault</title>
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff6d5a'/%3E%3Cpath d='M10 22V10l12 12V10' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#ff6d5a"/><path d="M10 22V10l12 12V10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>n8n Vault</span>
    </a>
    <div class="topbar-right">
      <span id="sync-status" class="sync-status" title="Automatic sync status"></span>
      <button id="sync-now" class="btn btn-outline btn-sm" hidden>Sync now</button>
      <button id="nav-admin" class="btn btn-ghost btn-sm" hidden>Admin</button>
      <div class="user-chip">
        <span id="user-email"></span>
        <button id="logout" class="btn btn-ghost btn-sm" title="Sign out">Sign out</button>
      </div>
    </div>
  </header>

  <div class="layout" id="main-view">
    <aside class="sidebar">
      <div class="sidebar-header">
        <input id="search" type="search" placeholder="Search workflows…" aria-label="Search workflows" />
      </div>
      <nav id="workflow-list" class="workflow-list" aria-label="Workflows"></nav>
    </aside>

    <main class="content" id="content">
      <div class="empty-state" id="empty-state">
        <svg viewBox="0 0 32 32" width="56" height="56" aria-hidden="true" opacity="0.25"><rect width="32" height="32" rx="8" fill="#526176"/><path d="M10 22V10l12 12V10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h2>Select a workflow</h2>
        <p>Pick a workflow on the left to see its version history and what changed in each version.</p>
      </div>
      <div id="detail" hidden></div>
    </main>
  </div>

  <div class="layout" id="admin-view" hidden>
    <main class="content content-wide" id="admin-content"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="/assets/app.js"></script>
</body>
</html>
